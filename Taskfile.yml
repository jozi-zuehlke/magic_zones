version: '3'

vars:
  CONFIGURATION: '{{default "Release" .CONFIGURATION}}'
  RUNTIME: '{{default "win-x64" .RUNTIME}}'
  IMAGE_REGISTRY: localhost
  IMAGE_NAME: '{{default "magic-zones" .IMAGE_NAME}}'
  IMAGE_TAG: '{{default "latest" .IMAGE_TAG}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  restore:
    desc: Restore NuGet packages
    cmds:
      - dotnet restore MagicZonesPortable.sln

  build:
    desc: Build the project
    deps: [restore]
    cmds:
      - dotnet build MagicZonesPortable.sln -c {{.CONFIGURATION}} --no-restore

  test:
    desc: Run tests
    deps: [restore]
    cmds:
      - dotnet test MagicZonesPortable.sln -c {{.CONFIGURATION}} --no-restore --logger "trx;LogFileName=test-results.trx"

  publish:
    desc: Publish framework-dependent single-file Windows executable
    deps: [restore]
    cmds:
      - rm -rf .publish
      - mkdir -p .publish
      - >
        dotnet publish src/MagicZonesPortable/MagicZonesPortable.csproj
        -c {{.CONFIGURATION}}
        -r {{.RUNTIME}}
        --self-contained false
        -o .publish
        -p:PublishSingleFile=true
        -p:PublishTrimmed=false
        -p:DebugType=None
        -p:DebugSymbols=false
        --no-restore

  publish-with-image:
    desc: Build container image with Podman
    cmds:
      - rm -rf .publish
      - mkdir -p .publish
      - |
        podman build \
          -f magic_zones.Containerfile \
          -t {{.IMAGE_REGISTRY}}/{{.IMAGE_NAME}}:{{.IMAGE_TAG}} \
          --cap-drop ALL \
          --cap-add CHOWN \
          --cap-add DAC_OVERRIDE \
          --cap-add FOWNER \
          --cap-add FSETID \
          --cap-add SETGID \
          --cap-add SETUID \
          .
      - podman create --name magic_zones {{.IMAGE_REGISTRY}}/{{.IMAGE_NAME}}:{{.IMAGE_TAG}}
      - defer: podman rm magic_zones
      - podman cp magic_zones:/magic_zones/MagicZonesPortable.exe ./.publish/MagicZonesPortable.exe

  clean:
    desc: Clean build outputs and artifacts
    cmds:
      - dotnet clean MagicZonesPortable.sln
      - rm -rf .publish
